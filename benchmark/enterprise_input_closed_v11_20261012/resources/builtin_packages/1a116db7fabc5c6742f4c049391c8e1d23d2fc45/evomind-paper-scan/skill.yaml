name: evomind-paper-scan
version: 1.0.0
title: EvoMind Paper Scan
description: OpenClaw-compatible academic paper review skill with 29-dimension audit, source-data numeric scan, bilingual reports, and EvoMind Word internal report generation.
entrypoint: SKILL.md
openclaw:
  system_prompt: SYSTEM_PROMPT.md
  agent_config: agents/openai.yaml
  usage: OPENCLAW.md
artifacts:
  reports:
    default_dir: reports
    bilingual: true
    word_docx: true
    pdf: true
capabilities:
  - paper_overview
  - 29_dimension_review
  - source_data_review
  - table_numeric_scan
  - data_integrity_screen
  - bilingual_reporting
  - evomind_word_report
  - evomind_pdf_report
files:
  references:
    - references/29-dimension-checklist.md
    - references/numeric-scan-interpretation.md
  scripts:
    - scripts/run_evomind_paper_scan.py
    - scripts/generate_evomind_word_report.py
    - scripts/generate_evomind_pdf_report.py
    - scripts/paper_data_preflight.py
