    - main [ref=f8e41]:
      - region [ref=f8e42]:
        - heading "Corravale Privacy Statement" [level=2] [ref=f8e44]
        - generic [ref=f8e45]:
          - paragraph [ref=f8e46]: Last Revision Date — March 14, 2023
          - paragraph [ref=f8e47]: "Corravale University (CU) recognizes and values the privacy of its community members and guests. This commitment is reflected in Trustees' Bylaw Sec. 14.07, Privacy and Access to Information, which states in part:"
          - paragraph [ref=f8e48]: “In gathering, using, and disclosing information about the individuals connected with the university, the university will work to safeguard personal privacy, to use such information solely for the purpose for which it was gathered, and to make individuals aware of the personal information about them that is being gathered, used, or disclosed.”
          - generic [ref=f8e49]:
            - heading "Overview" [level=4] [ref=f8e50]
            - paragraph [ref=f8e51]: "In principle, Corravale strives to:"
            - list [ref=f8e52]:
              - listitem [ref=f8e53]: Gather, retain, and use only the minimum amount of personal information required for its legitimate institutional purposes, and to satisfy the legal obligations that apply to it.
              - listitem [ref=f8e54]: Make every reasonable effort to keep the personal information we maintain accurate and current.
              - listitem [ref=f8e55]: Restrict access to the personal information we hold so that only those with a legitimate, clearly defined need are able to view it.
              - listitem [ref=f8e56]: Safeguard personal information with suitable physical and technical security controls matched to the sensitivity of the personal data we keep.
              - listitem [ref=f8e57]: Keep our students, faculty, employees, suppliers, partners, and others informed about how personal information is used across our day-to-day operations.
              - listitem [ref=f8e58]: Offer opportunities to control your own personal information, as permitted under applicable United States and other laws.
              - listitem [ref=f8e59]: Embed privacy principles into the design of every project or activity we undertake that relies on the use of personal data.
          - heading "Scope" [level=4] [ref=f8e60]
          - paragraph [ref=f8e61]: The Corravale Privacy Statement applies broadly to activities carried out by Corravale that involve the collection and processing of personal information. It is intended to give you a wide-ranging overview of these activities and of the way we approach the protection of your privacy.
          - paragraph [ref=f8e62]: Corravale is a large institution, and it is challenging to present a complete picture of all the personal information we gather and use across the organization. You can find more specific details in the individual privacy notices published by the schools, departments, units, or groups with which you interact.
          - heading "Categories of Personal Information We Collect and Use" [level=4] [ref=f8e63]
          - paragraph [ref=f8e64]: We consider personal information to be any information that relates to an identified or identifiable individual person.
          - paragraph [ref=f8e65]: "In general, at an institutional level we collect and make use of the following categories of information:"
          - list [ref=f8e66]:
            - listitem [ref=f8e67]: "Prospective students : personal and family details tied to the application and financial aid process, including supporting documentation, identification, and contact information; this may include data relating to ethnic origin, where the prospective student chooses to disclose such data."
            - listitem [ref=f8e68]: "Students : the details submitted while a prospective student, information about their academic record, their academic performance, and video images captured on campus."
            - listitem [ref=f8e69]: "Faculty and staff : identification, contact information, biographic details, information related to compensation, to benefits, to family members, and information about their performance at work."
            - listitem [ref=f8e70]: "Visiting scholars and exchange students : identification, contact information, biographic details, and possibly information related to health."
            - listitem [ref=f8e71]: "Subjects of our research projects : as required, identification and contact information, together with all of the information that is produced and observed in relation to the subject over the course of the research project."
            - listitem [ref=f8e72]: "Alumni : identification and contact information, along with donor and giving history."
            - listitem [ref=f8e73]: "Website visitors : the internet domain from which a visitor reaches the website, the IP address assigned to the visitor's computer, the type of browser in use, and the date and time of the visit."
            - listitem [ref=f8e74]: "Patients of Corravale Health : identification and contact information, along with data related to health and billing."
          - heading "How We Use Personal Information" [level=4] [ref=f8e75]
          - paragraph [ref=f8e76]: We use your personal information only for legitimate and clearly defined purposes and to support the many operations that keep the University running.
          - paragraph [ref=f8e77]: "In general, we make use of personal information in the following ways:"
          - list [ref=f8e78]:
            - listitem [ref=f8e79]: To facilitate admission and to deliver higher education services to our undergraduate and graduate students and to prospective students.
            - listitem [ref=f8e80]: To administer the employment of our faculty members and staff.
            - listitem [ref=f8e81]: To support campus visits for our visiting scholars and exchange students each term.
            - listitem [ref=f8e82]: To deliver course materials, encourage engagement, and track attendance and completion for the subscribers of our online courses.
            - listitem [ref=f8e83]: To manage the attendance of individuals who register for conferences, symposia, and other events.
            - listitem [ref=f8e84]: To keep our alumni connected to the community.
            - listitem [ref=f8e85]: For the purpose of delivering healthcare services to our patients.
            - listitem [ref=f8e86]: To enable the participation of individuals who take part in our research projects.
            - listitem [ref=f8e87]: To support website performance and improve the experience of visitors to our website.
            - listitem [ref=f8e88]: Video images captured by our video security system to protect the physical safety of our community members and to safeguard our property.
          - paragraph [ref=f8e89]: From time to time we may process other personal information for various legitimate and specific purposes. Whenever these situations arise, we will make every effort to inform you.
          - heading "Who Has Access to Your Information" [level=4] [ref=f8e90]
          - paragraph [ref=f8e91]: Corravale does not sell your information to third parties, and it does not share your information with third parties for any purpose other than supporting the legitimate interests and operations of the University.
          - paragraph [ref=f8e92]: We rely on a range of third-party services to help carry out the University's business. We work hard to uphold the confidentiality, privacy, and security standards that we require of all our service providers, and we work to ensure that they use your personal information only for the purpose of providing those services.
          - heading "How We Secure Your Information" [level=4] [ref=f8e93]
          - paragraph [ref=f8e94]: Corravale understands how important it is to maintain the security of the information it collects and holds, and we work to protect that information from unauthorized access and harm. Corravale strives to keep reasonable security measures in place, including physical, administrative, and technical safeguards, to protect your personal information.
          - heading "Privacy Statement Changes" [level=4] [ref=f8e95]
          - paragraph [ref=f8e96]: This privacy statement may be revised from time to time. We will post the date of the most recent update at the top of this page.
          - heading "Who to Contact with Questions or Concerns" [level=4] [ref=f8e97]
          - paragraph [ref=f8e98]:
            - text: If you have any concerns or questions about how your personal data is being used, please contact the
            - link "Data Privacy Office" [ref=f8e99] [cursor=pointer]:
              - /url: /_404.html
            - text: .
          - heading "Special Notices" [level=4] [ref=f8e100]
          - group [ref=f8e101]:
            - generic "Persons under the age of 13, or their parents or guardians" [ref=f8e102] [cursor=pointer]
            - paragraph [ref=f8e188]: COPPA places legal and regulatory obligations on certain operators of websites or online services that are directed to children under 13 years of age, and on certain operators of other websites or online services that have actual knowledge that they are collecting personal information online from a child under 13 years of age. The Federal Trade Commission, the consumer protection agency of the United States, enforces COPPA , which sets out what operators of websites and online services that are subject to COPPA are required to do in order to protect the privacy and safety of children under the age of 13 online whenever COPPA applies. Corravale, together with the vendors with whom we work, sometimes collects data from children under the age of 13, or shares such information with one another. The collection and sharing of this information is carried out in accordance with all applicable law, including COPPA to the extent that it applies in the circumstances.
          - group [ref=f8e103]:
            - generic "Persons located within the European Union" [active] [ref=f8e104] [cursor=pointer]
            - generic [ref=f8e189]:
              - paragraph [ref=f8e190]:
                - text: If you happen to be located in the EU, then the way Corravale handles your personal information may instead be governed by
                - link "Regulation 2016/679 (the General Data Protection Regulation, or the “GDPR”)" [ref=f8e191] [cursor=pointer]:
                  - /url: /_404.html
                - text: .
              - paragraph [ref=f8e192]:
                - text: Beyond the general privacy details already outlined above, we offer further guidance that applies specifically to the EU legal framework, set out below. Please also see our
                - link "GDPR resources webpage" [ref=f8e193] [cursor=pointer]:
                  - /url: /_404.html
                - text: to learn more.
              - heading "Legal basis for processing" [level=5] [ref=f8e194]
              - paragraph [ref=f8e195]: "The lawful grounds on which Corravale processes your personal information will differ according to the situation at hand. As a general matter, we most commonly depend on the following legal bases whenever we process your personal information under the GDPR:"
              - list [ref=f8e196]:
                - listitem [ref=f8e197]: "Necessity to enter into or to perform a contract (ex: for the online applications you submit; for the details you supply when enrolling; for the payment information we handle in connection with tuition);"
                - listitem [ref=f8e198]: Necessity for our legitimate interests or those of third parties (our legitimate interest in sustaining a lasting network for graduates);
                - listitem [ref=f8e199]: Consent (for the research studies you may choose to take part in; for the processing of special categories of personal data).
              - heading "Your rights" [level=5] [ref=f8e200]
              - paragraph [ref=f8e201]: Corravale is dedicated to helping you exercise the rights that EU data protection law grants to you promptly and without undue delay.
              - paragraph [ref=f8e202]: "Within the scope of our processing activities that fall under the GDPR, you hold the following rights concerning your personal information:"
              - list [ref=f8e203]:
                - listitem [ref=f8e204]: Access, correction and related requests – You have the right to confirm whether we are processing your personal data, together with the right to learn what personal data we hold about you. You may also request a copy of that data. In addition, and in certain circumstances, you may have the right to seek erasure, correction, restriction and portability of the personal data we keep about you.
                - listitem [ref=f8e205]: Right to object – You may object to receiving marketing communications from us by following the opt-out steps included in our marketing emails, and you may also object, on grounds relating to your particular situation, to any processing of your personal data. Where that happens, we will review your request and reply within a reasonable time, in keeping with our legal duties.
                - listitem [ref=f8e206]: Right to withdraw consent – For every processing operation that rests on your consent, you may withdraw that consent whenever you wish, and we will cease those processing operations to the extent the law permits.
              - paragraph [ref=f8e207]: Please keep in mind that, when you exercise these rights, if we cannot be sure of your identity, we may need to request additional personal information from you, which will be used solely for the purpose of answering your request.
              - heading "Retention period" [level=5] [ref=f8e208]
              - paragraph [ref=f8e209]: We aim to hold personal data in our systems only for as long as it is needed for the purposes for which it was gathered and processed. Retention periods differ and are set with regard to our legitimate interests and every applicable legal requirement.
              - heading "Data transfers" [level=5] [ref=f8e210]
              - paragraph [ref=f8e211]: When you engage with Corravale, your personal information is transferred to the United States. The United States is not presently among the countries outside the European Union that the European Commission has recognized as offering an adequate level of legal protection for personal information. To make sure that transfers of personal information from the EU remain lawful, Corravale relies on the derogations set out in Article 49 GDPR. Specifically, we rely on your explicit consent for certain transfers and on necessity for the performance of a contract or the carrying out of pre-contractual steps taken at your request (for example, for the transfer of personal data required to process your application for admission). Even so, please be assured that we put safeguards in place for the information transferred, as the GDPR itself requires and in line with this General Privacy Statement.
              - heading "Concerns" [level=5] [ref=f8e212]
              - paragraph [ref=f8e213]:
                - text: Should you have any concerns or questions about the ways in which your personal data is used, please reach out to the
                - link "Data Privacy Office" [ref=f8e214] [cursor=pointer]:
                  - /url: /_404.html
                - text: . We will respond to your request without delay and do all we can to resolve your concern. If, however, you feel that we have not handled your concern as it should be, you have the right to lodge a complaint with your local data protection authority, as provided by Article 77 of the GDPR. You are also entitled to file a complaint in the Member State of your residence, your place of work, or where an alleged breach of the GDPR occurred.
