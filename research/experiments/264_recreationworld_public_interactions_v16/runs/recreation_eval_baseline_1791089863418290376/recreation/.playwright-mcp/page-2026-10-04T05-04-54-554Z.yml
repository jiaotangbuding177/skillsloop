        - heading "Corravale Privacy Notice" [level=2] [ref=f24e62]
        - generic [ref=f24e63]:
          - paragraph [ref=f24e64]: Last Revision Date — May 12, 2024
          - paragraph [ref=f24e65]: Corravale University recognizes and values the privacy of its community members and guests. We work to set the standard in the ways we handle your personal information. We are dedicated to transparency by helping you understand what personal information we gather, how we make use of it, and when we choose to share it.
          - generic [ref=f24e66]:
            - heading "At a Glance" [level=4] [ref=f24e67]
            - paragraph [ref=f24e68]: "If you don’t have time for the full privacy notice below, here is what you should know:"
            - list [ref=f24e69]:
              - listitem [ref=f24e70]: Corravale University is a large institution that operates many different websites. This notice applies to our primary website, corravale.edu. Individual Corravale units and organizations may maintain their own privacy notices.
              - listitem [ref=f24e71]: Our aim is to limit the information we gather to only what we need to support our academic, research, and healthcare missions.
              - listitem [ref=f24e72]: We are committed to using your personal information only for the purposes for which it was originally gathered.
              - listitem [ref=f24e73]: We never sell your personal information, and when we share it beyond Corravale, we do so only to enable operations and services carried out on the university’s behalf, to satisfy legal obligations, or to protect the safety, property, or rights of the university, its community and guests.
              - listitem [ref=f24e74]:
                - text: We aim to provide you
                - link "choices" [ref=f24e75] [cursor=pointer]:
                  - /url: /about/privacy/#choices
                - text: regarding the personal information gathered on our website.
              - listitem [ref=f24e76]:
                - text: If you have questions or concerns about your privacy on the corravale.edu website, please contact the
                - link "Data Privacy Office" [ref=f24e77] [cursor=pointer]:
                  - /url: /_404.html
                - text: .
          - heading "Reach" [level=4] [ref=f24e78]
          - paragraph [ref=f24e79]:
            - text: This privacy notice explains how we handle personal information gathered on the Corravale primary website (corravale.edu). The broader
            - link "privacy overview" [ref=f24e80] [cursor=pointer]:
              - /url: /about/privacy-statement/
            - text: outlines the activities carried out across Corravale that involve the gathering and processing of your personal information.
          - paragraph [ref=f24e81]: Corravale schools, departments, units, clubs, labs, and other groups may keep privacy notices specific to their own collection and processing of your personal information, especially where it differs from the practices set out in this notice.
          - heading "Information That We Gather" [level=4] [ref=f24e82]
          - paragraph [ref=f24e83]: "The Corravale website gathers personal information through the following channels:"
          - list [ref=f24e84]:
            - listitem [ref=f24e85]: When you provide it to us directly, such as when you subscribe to a newsletter. This information may include your name and contact details.
            - listitem [ref=f24e86]:
              - text: When technology records your information
              - emphasis [ref=f24e87]: in real time
              - text: ", such as when a small file is stored on your device. Information gathered this way may include:"
              - list [ref=f24e88]:
                - listitem [ref=f24e89]: The network domain you use
                - listitem [ref=f24e90]: The device's IP address
                - listitem [ref=f24e91]: The browser you use
                - listitem [ref=f24e92]: The visit's date and time
                - listitem [ref=f24e93]: The address of the site that referred you to corravale.edu.
            - listitem [ref=f24e94]:
              - text: Once
              - emphasis [ref=f24e95]: external advertising and analytics partners
              - text: ", such as PageMetrics, gather your information on our behalf. Examples of the details collected by these external service partners include:"
              - list [ref=f24e96]:
                - listitem [ref=f24e97]: Pages viewed during the session
                - listitem [ref=f24e98]: Time and date of access
                - listitem [ref=f24e99]: Total time spent browsing the site
                - listitem [ref=f24e100]: Approximate location from IP address
                - listitem [ref=f24e101]: General demographic data
                - listitem [ref=f24e102]: Search queries typed into the site.
          - heading "How Your Information Is Used" [level=4] [ref=f24e103]
          - paragraph [ref=f24e104]: "Corravale draws on details about how you interact with our website in order to:"
          - list [ref=f24e105]:
            - listitem [ref=f24e106]: Keep our website running smoothly by tracking site performance and improving its functionality and overall user experience.
            - listitem [ref=f24e107]: Connect more effectively with prospective students and the wider global community by sharing relevant details about university services, events, and academic programs.
            - listitem [ref=f24e108]: On occasion we may use personal information for other legitimate and clearly defined purposes. When such cases arise, we will make every effort to notify you.
          - heading "Parties We Share Your Information With" [level=4] [ref=f24e109]
          - paragraph [ref=f24e110]: We neither sell nor rent the personal information collected here. We may share it with service providers that help support our operations and activities. We ask every service provider to keep your personal information secure and to use or share it solely to deliver services on our behalf.
          - paragraph [ref=f24e111]: We may also disclose your personal information when the law requires it, or when we believe doing so will help safeguard the safety, property, or rights of the university, members of the university community, and university guests.
          - heading "The Choices You Are Able to Make About Your Data" [level=4] [ref=f24e112]
          - paragraph [ref=f24e113]: "When you browse corravale.edu, “cookies” are stored on your computer or device. Cookies are small files that record information about your visits and interactions with the site. When you access corravale.edu, the cookies below may be placed on your device, depending on your browser settings:"
