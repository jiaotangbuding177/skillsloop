          - heading "How We Protect and Safeguard Your Data" [level=4] [ref=f24e181]
          - paragraph [ref=f24e182]: Corravale University understands how vital it is to safeguard the information gathered across our community. We work diligently to shield your data from unauthorized access, loss, or misuse, and we maintain sensible safeguards designed to keep the personal information you share with us protected at all times.
          - heading "Changes to This Notice" [level=4] [ref=f24e183]
          - paragraph [ref=f24e184]: We may revise this privacy notice periodically as our practices evolve. The date of the most recent revision will always appear near the top of this page for your reference.
          - heading "Who to Reach with Questions or Concerns" [level=4] [ref=f24e185]
          - paragraph [ref=f24e186]:
