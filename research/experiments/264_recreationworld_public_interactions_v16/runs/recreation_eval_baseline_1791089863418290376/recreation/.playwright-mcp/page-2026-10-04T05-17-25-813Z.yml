  - main [ref=f45e63]:
    - heading "Corravale Privacy Statement" [level=2] [ref=f45e65]
    - generic [ref=f45e67]:
      - paragraph [ref=f45e68]: Last Revision Date — March 14, 2023
      - paragraph [ref=f45e69]: "Corravale University (CU) recognizes and values the privacy of its community members and guests. This commitment is reflected in Trustees' Bylaw Sec. 14.07, Privacy and Access to Information, which states in part:"
      - paragraph [ref=f45e70]: “In gathering, using, and disclosing information about the individuals connected with the university, the university will work to safeguard personal privacy, to use such information solely for the purpose for which it was gathered, and to make individuals aware of the personal information about them that is being gathered, used, or disclosed.”
      - heading "Overview" [level=4] [ref=f45e71]
      - paragraph [ref=f45e72]: "In principle, Corravale strives to:"
      - list [ref=f45e73]:
        - listitem [ref=f45e74]: Gather, retain, and use only the minimum amount of personal information required for its legitimate institutional purposes, and to satisfy the legal obligations that apply to it.
        - listitem [ref=f45e75]: Make every reasonable effort to keep the personal information we maintain accurate and current.
        - listitem [ref=f45e76]: Restrict access to the personal information we hold so that only those with a legitimate, clearly defined need are able to view it.
        - listitem [ref=f45e77]: Safeguard personal information with suitable physical and technical security controls matched to the sensitivity of the personal data we keep.
        - listitem [ref=f45e78]: Keep our students, faculty, employees, suppliers, partners, and others informed about how personal information is used across our day-to-day operations.
        - listitem [ref=f45e79]: Offer opportunities to control your own personal information, as permitted under applicable United States and other laws.
        - listitem [ref=f45e80]: Embed privacy principles into the design of every project or activity we undertake that relies on the use of personal data.
      - heading "Scope" [level=4] [ref=f45e81]
      - paragraph [ref=f45e82]: The Corravale Privacy Statement applies broadly to activities carried out by Corravale that involve the collection and processing of personal information. It is intended to give you a wide-ranging overview of these activities and of the way we approach the protection of your privacy.
      - paragraph [ref=f45e83]: Corravale is a large institution, and it is challenging to present a complete picture of all the personal information we gather and use across the organization. You can find more specific details in the individual privacy notices published by the schools, departments, units, or groups with which you interact.
      - heading "Categories of Personal Information We Collect and Use" [level=4] [ref=f45e84]
      - paragraph [ref=f45e85]: We consider personal information to be any information that relates to an identified or identifiable individual person.
      - paragraph [ref=f45e86]: "In general, at an institutional level we collect and make use of the following categories of information:"
      - list [ref=f45e87]:
        - listitem [ref=f45e88]:
          - strong [ref=f45e89]: Prospective students
          - text: ": personal and family details tied to the application and financial aid process, including supporting documentation, identification, and contact information; this may include data relating to ethnic origin, where the prospective student chooses to disclose such data."
        - listitem [ref=f45e90]:
          - strong [ref=f45e91]: Students
          - text: ": the details submitted while a prospective student, information about their academic record, their academic performance, and video images captured on campus."
        - listitem [ref=f45e92]:
          - strong [ref=f45e93]: Faculty and staff
          - text: ": identification, contact information, biographic details, information related to compensation, to benefits, to family members, and information about their performance at work."
        - listitem [ref=f45e94]:
          - strong [ref=f45e95]: Visiting scholars and exchange students
          - text: ": identification, contact information, biographic details, and possibly information related to health."
        - listitem [ref=f45e96]:
          - strong [ref=f45e97]: Subjects of our research projects
          - text: ": as required, identification and contact information, together with all of the information that is produced and observed in relation to the subject over the course of the research project."
        - listitem [ref=f45e98]:
          - strong [ref=f45e99]: Alumni
          - text: ": identification and contact information, along with donor and giving history."
        - listitem [ref=f45e100]:
          - strong [ref=f45e101]: Website visitors
          - text: ": the internet domain from which a visitor reaches the website, the IP address assigned to the visitor's computer, the type of browser in use, and the date and time of the visit."
        - listitem [ref=f45e102]:
          - strong [ref=f45e103]: Patients of Corravale Health
          - text: ": identification and contact information, along with data related to health and billing."
      - heading "How We Use Personal Information" [level=4] [ref=f45e104]
      - paragraph [ref=f45e105]: We use your personal information only for legitimate and clearly defined purposes and to support the many operations that keep the University running.
      - paragraph [ref=f45e106]: "In general, we make use of personal information in the following ways:"
      - list [ref=f45e107]:
        - listitem [ref=f45e108]: To facilitate admission and to deliver higher education services to our undergraduate and graduate students and to prospective students.
        - listitem [ref=f45e109]: To administer the employment of our faculty members and staff.
        - listitem [ref=f45e110]: To support campus visits for our visiting scholars and exchange students each term.
        - listitem [ref=f45e111]: To deliver course materials, encourage engagement, and track attendance and completion for the subscribers of our online courses.
        - listitem [ref=f45e112]: To manage the attendance of individuals who register for conferences, symposia, and other events.
        - listitem [ref=f45e113]: To keep our alumni connected to the community.
        - listitem [ref=f45e114]: For the purpose of delivering healthcare services to our patients.
        - listitem [ref=f45e115]: To enable the participation of individuals who take part in our research projects.
        - listitem [ref=f45e116]: To support website performance and improve the experience of visitors to our website.
        - listitem [ref=f45e117]: Video images captured by our video security system to protect the physical safety of our community members and to safeguard our property.
      - paragraph [ref=f45e118]: From time to time we may process other personal information for various legitimate and specific purposes. Whenever these situations arise, we will make every effort to inform you.
      - heading "Who Has Access to Your Information" [level=4] [ref=f45e119]
      - paragraph [ref=f45e120]: Corravale does not sell your information to third parties, and it does not share your information with third parties for any purpose other than supporting the legitimate interests and operations of the University.
      - paragraph [ref=f45e121]: We rely on a range of third-party services to help carry out the University's business. We work hard to uphold the confidentiality, privacy, and security standards that we require of all our service providers, and we work to ensure that they use your personal information only for the purpose of providing those services.
      - heading "How We Secure Your Information" [level=4] [ref=f45e122]
      - paragraph [ref=f45e123]: Corravale understands how important it is to maintain the security of the information it collects and holds, and we work to protect that information from unauthorized access and harm. Corravale strives to keep reasonable security measures in place, including physical, administrative, and technical safeguards, to protect your personal information.
      - heading "Privacy Statement Changes" [level=4] [ref=f45e124]
      - paragraph [ref=f45e125]: This privacy statement may be revised from time to time. We will post the date of the most recent update at the top of this page.
      - heading "Who to Contact with Questions or Concerns" [level=4] [ref=f45e126]
      - paragraph [ref=f45e127]:
        - text: If you have any concerns or questions about how your personal data is being used, please contact the
        - link "Data Privacy Office" [ref=f45e128] [cursor=pointer]:
          - /url: /_404.html
        - text: .
      - heading "Special Notices" [level=4] [ref=f45e129]
      - button "Persons under the age of 13, or their parents or guardians" [ref=f45e131]
      - button "Persons located within the European Union" [ref=f45e136]
