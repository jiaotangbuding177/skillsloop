  - main [ref=f7e68]:
    - generic [ref=f7e429]:
      - heading "Corravale Privacy Notice" [level=2] [ref=f7e431]
      - generic [ref=f7e432]:
        - paragraph [ref=f7e433]: Last Revision Date — May 12, 2024
        - paragraph [ref=f7e434]: Corravale University recognizes and values the privacy of its community members and guests. We work to set the standard in the ways we handle your personal information. We are dedicated to transparency by helping you understand what personal information we gather, how we make use of it, and when we choose to share it.
        - heading "At a Glance" [level=3] [ref=f7e435]
        - paragraph [ref=f7e436]: "If you don’t have time for the full privacy notice below, here is what you should know:"
        - list [ref=f7e437]:
          - listitem [ref=f7e438]: Corravale University is a large institution that operates many different websites. This notice applies to our primary website, corravale.edu. Individual Corravale units and organizations may maintain their own privacy notices.
        - list [ref=f7e439]:
          - listitem [ref=f7e440]: Our aim is to limit the information we gather to only what we need to support our academic, research, and healthcare missions.
        - list [ref=f7e441]:
          - listitem [ref=f7e442]: We are committed to using your personal information only for the purposes for which it was originally gathered.
        - list [ref=f7e443]:
          - listitem [ref=f7e444]: We never sell your personal information, and when we share it beyond Corravale, we do so only to enable operations and services carried out on the university’s behalf, to satisfy legal obligations, or to protect the safety, property, or rights of the university, its community and guests.
        - list [ref=f7e445]:
          - listitem [ref=f7e446]: We aim to provide you choices regarding the personal information gathered on our website.
        - list [ref=f7e447]:
          - listitem [ref=f7e448]: If you have questions or concerns about your privacy on the corravale.edu website, please contact the Data Privacy Office .
        - heading "Reach" [level=3] [ref=f7e449]
        - paragraph [ref=f7e450]: This privacy notice explains how we handle personal information gathered on the Corravale primary website (corravale.edu). The broader privacy overview outlines the activities carried out across Corravale that involve the gathering and processing of your personal information.
        - paragraph [ref=f7e451]: Corravale schools, departments, units, clubs, labs, and other groups may keep privacy notices specific to their own collection and processing of your personal information, especially where it differs from the practices set out in this notice.
        - heading "Information That We Gather" [level=3] [ref=f7e452]
        - paragraph [ref=f7e453]: "The Corravale website gathers personal information through the following channels:"
        - list [ref=f7e454]:
          - listitem [ref=f7e455]: When you provide it to us directly, such as when you subscribe to a newsletter. This information may include your name and contact details.
        - list [ref=f7e456]:
          - listitem [ref=f7e457]: "When technology records your information in real time , such as when a small file is stored on your device. Information gathered this way may include: The network domain you use"
        - list [ref=f7e458]:
          - listitem [ref=f7e459]: The device's IP address
        - list [ref=f7e460]:
          - listitem [ref=f7e461]: The browser you use
        - list [ref=f7e462]:
          - listitem [ref=f7e463]: The visit's date and time
        - list [ref=f7e464]:
          - listitem [ref=f7e465]: The address of the site that referred you to corravale.edu.
        - list [ref=f7e466]:
          - listitem [ref=f7e467]: "Once external advertising and analytics partners , such as PageMetrics, gather your information on our behalf. Examples of the details collected by these external service partners include: Pages viewed during the session"
        - list [ref=f7e468]:
          - listitem [ref=f7e469]: Time and date of access
        - list [ref=f7e470]:
          - listitem [ref=f7e471]: Total time spent browsing the site
        - list [ref=f7e472]:
          - listitem [ref=f7e473]: Approximate location from IP address
        - list [ref=f7e474]:
          - listitem [ref=f7e475]: General demographic data
        - list [ref=f7e476]:
          - listitem [ref=f7e477]: Search queries typed into the site.
        - heading "How Your Information Is Used" [level=3] [ref=f7e478]
        - paragraph [ref=f7e479]: "Corravale draws on details about how you interact with our website in order to:"
        - list [ref=f7e480]:
          - listitem [ref=f7e481]: Keep our website running smoothly by tracking site performance and improving its functionality and overall user experience.
        - list [ref=f7e482]:
          - listitem [ref=f7e483]: Connect more effectively with prospective students and the wider global community by sharing relevant details about university services, events, and academic programs.
        - list [ref=f7e484]:
          - listitem [ref=f7e485]: On occasion we may use personal information for other legitimate and clearly defined purposes. When such cases arise, we will make every effort to notify you.
        - heading "Parties We Share Your Information With" [level=3] [ref=f7e486]
        - paragraph [ref=f7e487]: We neither sell nor rent the personal information collected here. We may share it with service providers that help support our operations and activities. We ask every service provider to keep your personal information secure and to use or share it solely to deliver services on our behalf.
        - paragraph [ref=f7e488]: We may also disclose your personal information when the law requires it, or when we believe doing so will help safeguard the safety, property, or rights of the university, members of the university community, and university guests.
        - paragraph [ref=f7e489]: "When you browse corravale.edu, “cookies” are stored on your computer or device. Cookies are small files that record information about your visits and interactions with the site. When you access corravale.edu, the cookies below may be placed on your device, depending on your browser settings:"
        - paragraph [ref=f7e490]: Here you can control which categories of cookies our website places on your device.
        - paragraph [ref=f7e491]: Several pages across our website include embedded buttons for sharing content on social media. When you use these buttons, the social media platforms may store cookies or apply other tracking technologies on your device. We have no access to, and no control over, any information gathered through those buttons. Each social media platform decides how it handles the information it collects. For details on how a particular platform uses cookies, please review the cookie policies of Z , Streamly , Pinstack , Careerly , Photogram and Vidcast .
        - heading "How We Protect and Safeguard Your Data" [level=3] [ref=f7e492]
        - paragraph [ref=f7e493]: Corravale University understands how vital it is to safeguard the information gathered across our community. We work diligently to shield your data from unauthorized access, loss, or misuse, and we maintain sensible safeguards designed to keep the personal information you share with us protected at all times.
        - heading "Changes to This Notice" [level=3] [ref=f7e494]
        - paragraph [ref=f7e495]: We may revise this privacy notice periodically as our practices evolve. The date of the most recent revision will always appear near the top of this page for your reference.
        - heading "Who to Reach with Questions or Concerns" [level=3] [ref=f7e496]
        - paragraph [ref=f7e497]: If you have concerns or questions about how your personal information is handled, please reach out to the Data Privacy Office .
        - heading "Specific Notices" [level=3] [ref=f7e498]
        - list [ref=f7e499]:
          - listitem [ref=f7e500]: Individuals under the age of 13 or their parents or guardians
        - list [ref=f7e501]:
          - listitem [ref=f7e502]: Individuals within the European Union
