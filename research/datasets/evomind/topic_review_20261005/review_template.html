<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EvoMind · 41条会话人工复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#23394b;font:15px 'Microsoft YaHei',sans-serif}header{background:#173d61;color:white;padding:20px 28px}h1{margin:0 0 8px;font-size:25px}header p{margin:5px 0;color:#dae7f1}.tools{padding:14px 24px;background:white;border-bottom:1px solid #d8e0e9;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#fff;color:#204c72;border:1px solid #aac0d4;border-radius:6px;padding:9px 12px}button.primary{background:#245f94;color:white;border-color:#245f94}input,select,textarea{border:1px solid #bdcbd8;border-radius:6px;padding:9px;background:white;max-width:100%}.layout{display:grid;grid-template-columns:310px 1fr;gap:20px;padding:20px 24px}.sidebar{background:white;border:1px solid #dce5ee;border-radius:10px;padding:12px;align-self:start;position:sticky;top:15px;max-height:90vh;overflow:auto}.sidebar input,.sidebar select{width:100%;margin-bottom:8px}.item{display:block;width:100%;text-align:left;margin:7px 0;color:#23394b;background:#fafcfe}.item.active{border:2px solid #276a9e;background:#eaf3fb}.item small{display:block;font-size:12px;margin-top:5px;color:#61778b}.tag{background:#e8eef5;border-radius:4px;padding:2px 5px;font-size:12px}main{min-width:0}.panel{background:white;padding:20px;border-radius:10px;border:1px solid #dce5ee;margin-bottom:16px}h2{font-size:20px;margin:0 0 12px}.muted{color:#667b8c;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:block;margin-bottom:6px;font-weight:600}textarea{width:100%;resize:vertical;min-height:78px}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.bubble{padding:14px 16px;border-radius:8px;margin:10px 0}.user{background:#eaf3fc;border-left:4px solid #3a78a9}.ai{background:#f5f7fa;border-left:4px solid #9eb1c3}.bubble pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.8 'Microsoft YaHei',sans-serif;margin:8px 0;max-height:520px;overflow:auto}.bubble.expanded pre{max-height:none}.who{font-weight:700}.ref{padding:10px;background:#f6f8fb;border-radius:6px;margin:8px 0}.note{background:#fff8e8;border:1px solid #f0ddb5;padding:12px;border-radius:6px}a{color:#206296}details{margin:8px 0}#toast{position:fixed;bottom:24px;right:25px;background:#173d61;color:white;max-width:540px;padding:14px;border-radius:8px;display:none;z-index:20}.empty{padding:20px;color:#788b9d}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.sidebar{position:static;max-height:300px}.formgrid{grid-template-columns:1fr}.wide{grid-column:1}}
</style></head><body>
<header><h1>41条会话 · 人工复核</h1><p>32条「目标不明确」＋9条「平台模板或模拟」。这些是AI初判，请按完整会话修正。</p><p>标注保存在当前浏览器。完成后请导出JSON备份；本页不会自动修改原数据或全量统计。</p></header>
<div class="tools"><strong id="progress"></strong><button id="export" class="primary">导出标注备份（JSON）</button><button id="csv">导出标注表（CSV）</button><button id="import">导入备份继续标注</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<div class="layout"><aside class="sidebar"><input id="search" placeholder="搜索会话编号、标题或正文"><select id="origin"><option value="">全部41条</option><option value="UNCLEAR">32条目标不明确</option><option value="PLATFORM">9条模板或模拟</option></select><select id="stateFilter"><option value="all">全部标注状态</option><option value="pending">仅待标注</option><option value="done">仅已标注</option></select><div id="caseList"></div></aside><main id="content"></main></div><div id="toast" role="status"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent),SCHEMA='evomind-topic-human-review-v1',KEY='evomind-topic-review:'+DATA.fingerprint;
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decisions={task:'有明确任务，需要重新分类',unclear:'目标仍不明确',platform:'确实是平台模板或模拟',mixed:'真实任务与模板或模拟混合',unknown:'现有证据无法判断'};
const fresh=()=>({schema:SCHEMA,dataset:DATA.fingerprint,labels:{},history:[]});let store=fresh(),current=DATA.cases[0].id,dirty=false,persistOK=true;
function notify(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
function validate(doc){if(!doc||doc.schema!==SCHEMA||doc.dataset!==DATA.fingerprint)throw Error('备份版本或数据指纹不匹配');if(!doc.labels||typeof doc.labels!=='object'||Array.isArray(doc.labels))throw Error('标注结构不正确');const ids=new Set(DATA.cases.map(x=>x.id));for(const [id,l]of Object.entries(doc.labels)){if(!ids.has(id)||!l||!Object.hasOwn(decisions,l.decision))throw Error('会话或判断不在当前范围');if(l.category!==''&&!Object.hasOwn(DATA.categories,l.category))throw Error('任务类别不正确');if(typeof l.task_description!=='string'||typeof l.note!=='string'||!Number.isFinite(Date.parse(l.updatedAt)))throw Error('文字或时间格式不正确');if(l.task_description.length>20000||l.note.length>20000)throw Error('备注过长');}return doc}
try{const saved=localStorage.getItem(KEY);if(saved)store=validate(JSON.parse(saved))}catch(error){persistOK=false;setTimeout(()=>notify('本地保存不可用或已有备份异常，请及时导出备份。'+error.message),100)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));persistOK=true}catch(error){persistOK=false;notify('浏览器保存失败，请立即导出JSON备份；不要关闭页面。')}}
function activeCase(){return DATA.cases.find(x=>x.id===current)}
function readForm(){return {decision:$('decision').value,category:$('category').value,task_description:$('description').value,note:$('note').value,updatedAt:new Date().toISOString(),basis:'human_explicit_topic_review'}}
function save(quiet=false){const label=readForm();if(!label.decision){if(!quiet)notify('请先选择你的判断');return false}validate({...fresh(),labels:{[current]:label}});store.history.push({session_id:current,before:store.labels[current]||null,after:label});store.labels[current]=label;persist();dirty=false;renderList();if(!quiet)notify(persistOK?'已保存本条标注':'已记录在内存，请导出备份');return true}
function beforeChange(){if(!dirty)return true;if($('decision').value)return save(true);return confirm('这条会话还有未保存的填写内容。放弃填写并切换吗？')}
function filtered(){const q=$('search').value.toLowerCase();return DATA.cases.filter(c=>(!$('origin').value||c.initial_category===$('origin').value)&&($('stateFilter').value==='all'||Boolean(store.labels[c.id])===($('stateFilter').value==='done'))&&(!q||[c.id,c.title,c.reason,...c.users.map(x=>x.text),...c.assistants.map(x=>x.text)].join(' ').toLowerCase().includes(q)))}
function renderList(){const cases=filtered();$('progress').textContent='已标注 '+Object.keys(store.labels).length+' / 41 · 待标注 '+(41-Object.keys(store.labels).length);$('caseList').innerHTML=cases.map(c=>'<button class="item '+(c.id===current?'active':'')+'" data-case="'+E(c.id)+'"><strong>'+E(c.id)+'</strong><small>'+E(c.initial_label)+' · '+(store.labels[c.id]?'✓ 已标注':'待标注')+'</small><small>'+E(c.users[0]?.clean_text.slice(0,60)||c.users[0]?.text.slice(0,60)||'没有保留下来的用户正文，见AI内容')+'</small></button>').join('')||'<p class="empty">没有符合筛选条件的会话</p>';for(const b of $('caseList').querySelectorAll('[data-case]'))b.onclick=()=>{if(beforeChange()){current=b.dataset.case;dirty=false;render()}}}
function bubble(node,who,kind){return '<div class="bubble '+kind+'" id="msg-'+E(node.id)+'"><span class="who">'+E(who)+'</span><pre>'+E(node.text)+'</pre><button data-expand="'+E(node.id)+'">展开全部高度</button><details><summary class="muted">来源编号与导出位置</summary><span class="muted">'+E(node.id)+'；原消息：'+E(node.source_messages.join('、'))+'；原文件行：'+E(node.source_lines.join('、'))+'</span></details></div>'}
function render(){renderList();const c=activeCase(),label=store.labels[c.id]||{},cats=Object.entries(DATA.categories).map(([k,v])=>'<option value="'+k+'">'+E(v)+'</option>').join('');let dialogue='',seen=new Set(),amap=new Map(c.assistants.map(a=>[a.id,a]));c.users.forEach((u,i)=>{dialogue+=bubble(u,'用户提问 '+(i+1),'user');if(u.clean_text!==u.text)dialogue+='<details><summary>查看去除平台开头包装后的正文</summary><div class="bubble user"><pre>'+E(u.clean_text||'去除已知包装后无其他正文')+'</pre></div></details>';if(!u.replies.length)dialogue+='<div class="ref muted">当前关联中未找到对应AI回复。</div>';for(const aid of u.replies){if(seen.has(aid)){dialogue+='<div class="ref">这条提问也对应前面已展示的AI正文：<a href="#msg-'+E(aid)+'">跳转查看</a>。相同正文不重复展开。</div>'}else{seen.add(aid);dialogue+=bubble(amap.get(aid),'AI回复','ai')}}});const unattached=c.assistants.filter(a=>!seen.has(a.id));if(unattached.length)dialogue+='<h2>尚无对应用户提问的AI正文</h2>'+unattached.map(a=>bubble(a,'AI正文（关联尚缺）','ai')).join('');
 $('content').innerHTML='<section class="panel"><h2>'+E(c.id)+'</h2><p><span class="tag">AI原分类：'+E(c.initial_label)+'</span></p><p>当前归类依据：'+E(c.reason)+'</p><details><summary>原始标题（仅作参考）及来源</summary><p>'+E(c.title||'无标题')+'</p><p class="muted">'+c.users.length+'组用户正文 / '+c.assistants.length+'组AI正文；回复关联'+(c.annotation_overlay_applied?'已叠加071最终标注':'保留066对应关系')+'。</p></details><p><a href="conversations/'+E(c.id)+'.md" target="_blank">打开本条完整文字版</a></p></section><section class="panel"><h2>你的判断</h2><div class="formgrid"><div><label for="decision">这条会话属于哪种情况？</label><select id="decision"><option value="">请选择（不会默认替你标注）</option>'+Object.entries(decisions).map(([k,v])=>'<option value="'+k+'">'+E(v)+'</option>').join('')+'</select></div><div><label for="category">若有任务，主要属于哪类？</label><select id="category"><option value="">未选择 / 不适用</option>'+cats+'</select></div><div class="wide"><label for="description">实际任务是什么？（可选，一行写一个）</label><textarea id="description" placeholder="例如：审查供应商合同；修改违约责任条款。没有可辨识任务时可留空。"></textarea></div><div class="wide"><label for="note">补充说明（可选）</label><textarea id="note" placeholder="例如：这段是我主动输入的模拟测试；真正的需求在附件里；缺前文，暂不能确定。"></textarea></div></div><div class="actions"><button id="save" class="primary">保存本条</button><button id="next">保存并到下一条待标注</button><button id="keep">确认原分类</button><button id="undo">撤销本条标注</button></div></section><section class="panel"><h2>完整会话正文</h2><p class="muted">重复正文只保留一份，未截断。长正文在框内滚动，也可展开全部高度。按导出位置排显示顺序，不能据此确认真实时间；原始缺失不补造。</p>'+(!c.users.length?'<p class="note">本条没有保留下来的用户正文；下面保留全部AI内容，供你判断。</p>':'')+dialogue+'</section>';
 $('decision').value=label.decision||'';$('category').value=label.category||'';$('description').value=label.task_description||'';$('note').value=label.note||'';for(const id of ['decision','category','description','note'])$(id).oninput=()=>dirty=true;$('save').onclick=()=>save();$('next').onclick=()=>{if(save()){const others=DATA.cases.filter(x=>!store.labels[x.id]);if(others.length){current=(others.find(x=>DATA.cases.indexOf(x)>DATA.cases.indexOf(c))||others[0]).id;render();scrollTo(0,0)}else notify('41条均已标注，请导出JSON备份。')}};$('keep').onclick=()=>{$('decision').value=c.initial_category==='UNCLEAR'?'unclear':'platform';$('category').value='';dirty=true;save()};$('undo').onclick=()=>{if(store.labels[current]&&confirm('撤销本条已保存的标注？')){store.history.push({session_id:current,before:store.labels[current],after:null});delete store.labels[current];persist();dirty=false;render()}};for(const b of $('content').querySelectorAll('[data-expand]'))b.onclick=()=>{const el=document.getElementById('msg-'+b.dataset.expand);el.classList.toggle('expanded');b.textContent=el.classList.contains('expanded')?'恢复滚动高度':'展开全部高度'};
}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function flush(){return !dirty||save()}
$('export').onclick=()=>{if(flush())download(new Blob([JSON.stringify({...store,exportedAt:new Date().toISOString(),scope_sessions:DATA.cases.map(c=>c.id)},null,2)],{type:'application/json'}),'evomind-topic-review-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json')};
$('csv').onclick=()=>{if(!flush())return;const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['会话编号','原分类','人工判断','任务类别','实际任务描述','备注','标注时间'],...DATA.cases.map(c=>{const l=store.labels[c.id];return[c.id,c.initial_label,l?decisions[l.decision]:'待标注',l?DATA.categories[l.category]||'':'',l?.task_description||'',l?.note||'',l?.updatedAt||'']})];download(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'evomind-topic-review.csv')};
$('import').onclick=()=>{if(flush())$('importFile').click()};$('importFile').onchange=async event=>{const f=event.target.files[0];if(!f)return;try{const doc=validate(JSON.parse(await f.text())),merged=JSON.parse(JSON.stringify(store));for(const[id,l]of Object.entries(doc.labels)){const old=merged.labels[id];if(!old||Date.parse(l.updatedAt)>Date.parse(old.updatedAt))merged.labels[id]=l}merged.history=[...(merged.history||[]),...(Array.isArray(doc.history)?doc.history:[])];store=merged;persist();dirty=false;render();notify('已合并备份，较新的本地标注保留。')}catch(error){notify('未导入：'+error.message)}finally{event.target.value=''}};
for(const id of ['search','origin','stateFilter'])$(id).oninput=renderList;window.onbeforeunload=event=>{if(dirty||!persistOK){event.preventDefault();event.returnValue=''}};render();
</script></body></html>
