 .user{border-left:4px solid #2e70d7}.context .assistant{border-left:4px solid #4d947f}details summary{cursor:pointer;color:#315982;padding:5px 0}.empty{padding:30px;text-align:center;color:#60738b}.counts{font-weight:600;font-size:12px}.context button{float:right}#importFile{display:none}a{color:#215ac1}.progressline{height:4px;background:#dce5f2;border-radius:4px;overflow:hidden;margin-top:8px}.progressline span{display:block;height:100%;background:#2d73de}#loadmsg{padding:40px}.legend{font-size:12px;line-height:1.6;margin-top:8px}

</style></head><body>
<header><div><h1>EvoMind · 人工匹配标注</h1><small>505 条会话 · 逐项核对用户输入与 AI 回复 · 同文折叠，原文不改写</small></div><div class="toptools"><input id="annotator" placeholder="标注人（可选）" aria-label="标注人"><button id="exportBtn">导出标注备份</button><button id="importBtn">导入标注</button><input id="importFile" type="file" accept=".json,application/json"></div></header>
<div class="savebar"><span id="globalProgress">正在载入…</span><span id="storageStatus">正在检查本地保存</span></div>
<div id="loadmsg">正在载入会话正文，请稍候…</div>
<div class="layout" id="app" hidden><aside><div class="searchbox"><input id="sessionSearch" placeholder="搜索会话编号或来源标题" aria-label="搜索会话"><select id="sessionFilter" aria-label="筛选会话"><option value="all">全部 505 条</option><option value="pending">尚未全部确认</option><option value="done">待核验项已全部确认</option><option value="ai">有 AI 归属不明（85 条）</option><option value="user">仅用户暂无 AI（420 条）</option></select><div id="sessionCount" class="counts"></div></div><div id="sessions"></div></aside><main class="workspace"><div class="casehead" id="casehead"></div><div class="casebody"><nav class="units"><select id="unitFilter" aria-label="核验项范围"><option value="issues">本会话待核验项</option><option value="all">本会话全部用户与 AI</option></select><div id="units"></div></nav><section class="detail" id="detail"></section></div></main></div>
<div class="toast" id="toast" role="status"></div><div class="context" id="context" role="dialog" aria-label="完整会话上下文"></div>
<script>/*__CORE__*/</script><script id="dataset" type="application/json">/*__DATA__*/</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent),C=AnnotationCore,$=id=>document.getElementById(id),KEY='evomind-annotation-068:'+DATA.fingerprint;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=C.empty(DATA.fingerprint),sid=DATA.sessions[0].id,pivot=null,selected=new Set(),mode='matched',note='',search='',showAll=false,limit=40,storageOK=true,storageLoadFailed=false,toastTimer;
function notify(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',6500);}
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);C.validateImport(parsed,DATA);state=parsed;state.drafts=state.drafts||{};state.history=state.history||[];}}catch(e){storageOK=false;storageLoadFailed=true;notify('本地保存读取失败；已停用自动覆盖旧数据。请导出本次标注备份。');}
$('annotator').value=state.annotator||'';
function persist(){state.annotator=$('annotator').value;state.updatedAt=new Date().toISOString();if(storageLoadFailed){$('storageStatus').textContent='旧保存读取异常，已保护旧记录：本次请导出备份';return;}try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('storageStatus').textContent='已自动保存在此浏览器 · 请定期导出备份';}catch(e){storageOK=false;$('storageStatus').textContent='浏览器保存不可用：请立即导出备份';notify('浏览器没有保存成功，标注暂在内存中；请点击“导出标注备份”。');}}
function session(){return DATA.sessions.find(s=>s.id===sid);}function node(role,id){return C.nodes(session(),role).find(n=>n.id===id);}function pkey(){return C.key(pivot.role,pivot.id);}function labelFor(s,t){return (state.labels[s.id]||{})[C.key(t.role,t.id)];}
function statusName(l){return !l?'未标注':l.decision==='matched'?'已确认匹配':l.decision==='none'?'已确认无匹配':'暂不能判断';}
function saveDraft(){if(!pivot)return;const bucket=state.drafts[sid]||(state.drafts[sid]={});bucket[pkey()]={decision:mode,targets:[...selected],note};persist();}
function renderSessions(){const term=$('sessionSearch').value.toLowerCase(),filter=$('sessionFilter').value;let count=0,done=0,resolved=0,reviewed=0;const rows=[];
for(const s of DATA.sessions){const p=C.progress(s,state);done+=p.done;resolved+=p.resolved;reviewed+=p.reviewed;let include=(s.id+' '+s.title).toLowerCase().includes(term)&&(filter!=='pending'||!p.done)&&(filter!=='done'||p.done)&&(filter!=='ai'||s.unassignedAI>0)&&(filter!=='user'||s.unassignedAI===0);if(!include)continue;count++;rows.push(`<button class="session ${s.id===sid?'active':''}" data-sid="${esc(s.id)}"><strong>${esc(s.title.slice(0,48))}${s.title.length>48?'…':''}</strong><div class="sid">${esc(s.id)}</div><span class="tag ${s.unassignedAI?'warn':''}">AI 归属不明 ${s.unassignedAI}</span><span class="tag">用户暂无 AI ${s.unassignedUser}</span><div class="subtitle">已确认 ${p.resolved} / ${p.total} 项${p.done?' · 完成':''}</div><div class="progressline"><span style="width:${p.resolved/p.total*100}%"></span></div></button>`);}
$('sessions').innerHTML=rows.join('')||'<p class="empty">没有符合条件的会话</p>';$('sessionCount').textContent=`显示 ${count} 条`;$('globalProgress').textContent=`已确认 ${resolved} / 2674 项 · 已完成 ${done} / 505 条会话 · 已查看并提交 ${reviewed} 项`;
}
function units(){const s=session();return $('unitFilter').value==='all'?[...s.users,...s.assistants].map(n=>({role:n.role,id:n.id})):s.issues;}
function renderUnits(){const s=session();$('units').innerHTML=units().map(t=>{const n=node(t.role,t.id),l=labelFor(s,t);return `<button class="unit ${pivot&&pkey()===C.key(t.role,t.id)?'active':''}" data-role="${t.role}" data-id="${t.id}"><strong>${t.role==='user'?'用户输入':'AI 回复'} ${n.number}</strong><span class="tag ${l&&l.decision!=='uncertain'?'done':''}">${statusName(l)}</span><div class="subtitle">${esc(n.text.slice(0,72))}${n.text.length>72?'…':''}</div></button>`;}).join('');}
function renderCase(){const s=session(),p=C.progress(s,state);$('casehead').innerHTML=`<div class="row"><h2>${esc(s.id)}</h2><div class="row"><button id="contextBtn">展开本会话全部对话</button><button id="nextSession">下一条未完成会话 →</button></div></div><div class="subtitle">${s.users.length} 组用户输入 · ${s.assistants.length} 组 AI 正文 · 已确认 ${p.resolved}/${p.total} 个待核验项。原始标题仅供查找，不作为匹配依据。</div><details><summary>查看来源标题与清理信息</summary><div class="subtitle">${esc(s.title)}<br>重试提示 ${s.isolated.retry} 条、空 AI ${s.isolated.emptyAI} 条已旁置；${s.conflict?'原始顺序有歧义':'未检出原始编号冲突'}。<a href="../../matched_066/private/conversations/${s.id}.html" target="_blank" rel="noopener">打开原核对页</a></div></details>`;
$('contextBtn').onclick=openContext;$('nextSession').onclick=()=>{const at=DATA.sessions.findIndex(x=>x.id===sid);const next=[...DATA.sessions.slice(at+1),...DATA.sessions.slice(0,at)].find(x=>!C.progress(x,state).done);if(next)chooseSession(next.id);else notify('其他会话的原待核验项均已确认。');};renderUnits();}
function chooseSession(id){sid=id;$('unitFilter').value='issues';const s=session();const first=s.issues.find(t=>!labelFor(s,t)||labelFor(s,t).decision==='uncertain')||s.issues[0];choosePivot(first.role,first.id);renderSessions();}
function choosePivot(role,id){pivot={role,id};search='';showAll=false;limit=40;const l=(state.drafts[sid]||{})[pkey()]||labelFor(session(),pivot);mode=l?.decision||'matched';selected=new Set(l?.targets||[]);note=l?.note||'';renderCase();renderDetail();$('detail').scrollTop=0;}
function positions(n){return `<details><summary>原文出现 ${n.occurrences.length} 次 · 查看编号和位置</summary><div class="subtitle">${n.occurrences.map(o=>esc(o.id)+` · 原第 ${o.line} 行`+(o.time?' · '+esc(o.time):'')).join('<br>')}</div></details>`;}
function machineInfo(n){const s=session();if(n.role==='assistant'){const m=s.machine[n.id];return `<div class="subtitle">机器当前对应：${m.users.length?m.users.map(id=>'用户输入 '+s.users.find(u=>u.id===id).number).join('、'):'暂无'}<br>${esc(m.reason)}</div>`;}const linked=s.assistants.filter(a=>s.machine[a.id].users.includes(n.id));return `<div class="subtitle">机器当前对应：${linked.length?linked.map(a=>'AI 回复 '+a.number).join('、'):'暂无'}</div>`;}
function renderDetail(){const n=node(pivot.role,pivot.id),op=pivot.role==='user'?'AI 回复':'用户输入',l=labelFor(session(),pivot);$('detail').innerHTML=`<div class="card"><h3>正在核对：${pivot.role==='user'?'用户输入':'AI 回复'} ${n.number}</h3><div class="note">${pivot.role==='user'?'请找出回答这条用户输入的 AI 回复，可包含过程说明、失败说明和最终结果。':'请找出这条 AI 正文对应的用户输入；同文跨多次请求出现时，可以多选。'}<br>确认时请勾选本项所有对应内容；未选项视为不匹配。“无匹配”表示在当前可见会话中找不到对应；证据不足请选择“暂不能判断”。</div><pre class="pivottext">${esc(n.text)}</pre>${positions(n)}${machineInfo(n)}<div class="legend">人工状态：<strong>${statusName(l)}</strong> · 机器候选不会自动勾选</div></div><div class="row"><h3 style="margin:0">潜在匹配 · ${op}</h3><button id="allCandidates">查看本会话全部候选</button></div><div class="row" style="margin-top:10px"><input style="flex:1" id="candidateSearch" placeholder="在本会话全部${op}中搜索正文或消息编号" aria-label="搜索候选"></div><div id="candidateCount" class="subtitle"></div><div id="candidates"></div><button id="moreCandidates" hidden>再显示 40 条</button><div class="decision"><div class="choices"><label><input type="radio" name="decision" value="matched" ${mode==='matched'?'checked':''}> 选择匹配（可多选）</label><label><input type="radio" name="decision" value="none" ${mode==='none'?'checked':''}> 无匹配</label><label><input type="radio" name="decision" value="uncertain" ${mode==='uncertain'?'checked':''}> 暂不能判断</label></div><textarea id="note" placeholder="备注（可选）：例如只回答了前半句、与另一次请求无法区分…" aria-label="标注备注">${esc(note)}</textarea><div id="decisionError" class="error" role="alert"></div><div class="row"><span id="selectedCount" class="counts"></span><div class="row"><button id="undoLabel">撤销本项标注</button><button id="saveLabel">确认此项</button><button class="primary" id="saveNext">确认并下一项 →</button></div></div><div class="subtitle">勾选和备注会暂存为草稿；点击“确认”才计入人工标注。建议每完成一批导出备份。</div></div>`;
$('allCandidates').onclick=()=>{showAll=!showAll;limit=40;renderCandidates();};$('candidateSearch').oninput=e=>{search=e.target.value.toLowerCase();limit=40;renderCandidates();};$('moreCandidates').onclick=()=>{limit+=40;renderCandidates();};$('note').oninput=e=>{note=e.target.value;saveDraft();};document.querySelectorAll('[name=decision]').forEach(el=>el.onchange=()=>{mode=el.value;if(mode!=='matched')selected.clear();saveDraft();renderCandidates();});$('saveLabel').onclick=()=>commit(false);$('saveNext').onclick=()=>commit(true);$('undoLabel').onclick=undo;renderCandidates();}
function renderCandidates(){const s=session(),all=C.nodes(s,pivot.role==='user'?'assistant':'user'),suggestions=s.suggestions[pkey()]||[],byId=new Map(suggestions.map(x=>[x.id,x.reason])),order=new Map(suggestions.map((x,i)=>[x.id,i]));
let list=all.filter(n=>(showAll||search||byId.has(n.id)||selected.has(n.id))&&(!search||(n.text+' '+n.occurrences.map(o=>o.id).join(' ')).toLowerCase().includes(search)));list.sort((a,b)=>(order.get(a.id)??999)-(order.get(b.id)??999)||a.number-b.number);
$('candidateCount').textContent=`显示 ${Math.min(limit,list.length)} / ${list.length} 条 · 本会话共有 ${all.length} 条可选${pivot.role==='user'?' AI 正文':'用户输入'}`;$('allCandidates').textContent=showAll?'只看推荐候选':'查看本会话全部候选';$('moreCandidates').hidden=list.length<=limit;
$('candidates').innerHTML=list.slice(0,limit).map(n=>{const existing=labelFor(s,{role:n.role,id:n.id});return `<div class="candidate ${selected.has(n.id)?'selected':''}"><label><input type="checkbox" data-target="${n.id}" ${selected.has(n.id)?'checked':''}>${n.role==='user'?'用户输入':'AI 回复'} ${n.number}</label><div class="subtitle">${esc(byId.get(n.id)||'本会话扩展候选，没有预设匹配结论')}${existing?' · 对侧人工状态：'+statusName(existing):''}</div><pre class="preview">${esc(n.text.slice(0,480))}${n.text.length>480?'…':''}</pre><details><summary>展开完整正文</summary><pre>${esc(n.text)}</pre></details>${positions(n)}${machineInfo(n)}</div>`;}).join('')||'<p class="empty">暂无候选。可以清空搜索、展开全部，或标记无匹配／暂不能判断。</p>';
$('selectedCount').textContent=mode==='matched'?`已选 ${selected.size} 条`:(mode==='none'?'将确认：无匹配':'将记录：暂不能判断（仍待核验）');document.querySelectorAll('[data-target]').forEach(el=>el.onchange=()=>{if(el.checked){selected.add(el.dataset.target);mode='matched';document.querySelector('[name=decision][value=matched]').checked=true;}else selected.delete(el.dataset.target);saveDraft();renderCandidates();});}
function commit(next){const s=session(),label={decision:mode,targets:[...selected],note,annotator:$('annotator').value.trim(),updatedAt:new Date().toISOString(),basis:'human_explicit_selection',granularity:'deduplicated_content_group'};try{const before=labelFor(s,pivot)||null;state.labels[sid]=C.apply(state,s,pivot.role,pivot.id,label);delete (state.drafts[sid]||{})[pkey()];state.history.push({session:sid,key:pkey(),before,after:label,at:label.updatedAt});persist();renderSessions();renderCase();if(next){const list=units(),at=list.findIndex(t=>C.key(t.role,t.id)===pkey());const target=[...list.slice(at+1),...list.slice(0,at)].find(t=>!labelFor(s,t)||labelFor(s,t).decision==='uncertain');if(target)choosePivot(target.role,target.id);else{renderDetail();notify('本会话此范围的项目已处理，可切换下一条会话。');}}else{renderDetail();notify('已保存本项人工标注。');}}catch(e){$('decisionError').textContent=e.message;}}
function undo(){const s=session(),before=labelFor(s,pivot)||null;if(state.labels[sid])delete state.labels[sid][pkey()];if(state.drafts[sid])delete state.drafts[sid][pkey()];state.history.push({session:sid,key:pkey(),before,after:null,at:new Date().toISOString()});persist();choosePivot(pivot.role,pivot.id);renderSessions();notify('已撤销本项人工标注，机器原结果不变。');}
function openContext(){const s=session(),all=[...s.users,...s.assistants].sort((a,b)=>a.occurrences[0].line-b.occurrences[0].line);$('context').innerHTML=`<div class="contextbar"><button id="closeContext">关闭上下文</button><h2>本会话完整正文</h2><p class="note">按原文件首次出现位置展示，不代表真实时间顺序。同文所有出现位置可展开；可点击任意一条进行标注。</p></div>`+all.map(n=>`<div class="card ${n.role}"><button data-context-role="${n.role}" data-context-id="${n.id}">标注这条</button><h3>${n.role==='user'?'用户输入':'AI 回复'} ${n.number}</h3><pre>${esc(n.text)}</pre>${positions(n)}${machineInfo(n)}</div>`).join('');$('context').style.display='block';$('closeContext').onclick=()=>$('context').style.display='none';document.querySelectorAll('[data-context-id]').forEach(el=>el.onclick=()=>{$('context').style.display='none';$('unitFilter').value='all';choosePivot(el.dataset.contextRole,el.dataset.contextId);});}
$('sessions').onclick=e=>{const b=e.target.closest('[data-sid]');if(b)chooseSession(b.dataset.sid);};$('units').onclick=e=>{const b=e.target.closest('[data-role]');if(b)choosePivot(b.dataset.role,b.dataset.id);};$('sessionSearch').oninput=renderSessions;$('sessionFilter').onchange=renderSessions;$('unitFilter').onchange=()=>{renderUnits();const list=units();if(!list.some(t=>C.key(t.role,t.id)===pkey())&&list.length)choosePivot(list[0].role,list[0].id);};$('annotator').onchange=persist;
$('exportBtn').onclick=()=>{const payload={...state,exportedAt:new Date().toISOString(),annotation_scope:'content_group_correspondence_not_verified_event_chronology'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evomind-human-annotations-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('已发起标注备份下载，请确认文件已保存。');};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const doc=JSON.parse(await f.text()),merged=C.merge(state,doc,DATA);merged.history.push({action:'import',filename:f.name,at:new Date().toISOString()});state=merged;persist();chooseSession(sid);notify('已合并导入人工标注；不同的已有标注不会被静默覆盖。');}catch(err){notify('导入未完成：'+err.message);}finally{e.target.value='';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('context').style.display='none';});
$('loadmsg').remove();$('app').hidden=false;$('storageStatus').textContent=storageOK?'本地自动保存已就绪 · 请定期导出备份':'本地读取异常：建议导出备份';chooseSession(sid);
</script></body></html>
