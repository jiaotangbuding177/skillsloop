   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="40.68" y="45.7758" transform="rotate(-0 40.68 45.7758)">Evaluation: measure downstream utility without leaking future feedback</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526372" x="40.68" y="77.4144" transform="rotate(-0 40.68 77.4144)">Proposed protocol | No experiments or effect sizes are claimed in this diagram.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="57.78" y="156.840525" transform="rotate(-0 57.78 156.840525)">A  Earlier conversations</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 187.339359)">Discover / generate skills</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 201.49057)">Tune rules only on development data</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="403.2" y="156.840525" transform="rotate(-0 403.2 156.840525)">B  Future task instances</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 187.339359)">Frozen generator and locked rubric</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 201.49057)">Same agent, model and task resources</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="748.62" y="156.840525" transform="rotate(-0 748.62 156.840525)">C  Unseen eligible users</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 187.339359)">Only reviewed organization skills</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 201.49057)">No private conversation transfer</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526372" x="367.29" y="175.8456" transform="rotate(-0 367.29 175.8456)">time</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526372" x="712.71" y="175.8456" transform="rotate(-0 712.71 175.8456)">transfer</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="57.78" y="336.125925" transform="rotate(-0 57.78 336.125925)">Paired downstream comparison</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 366.624759)">No skill / strong baselines / ours</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 380.77597)">Objective acceptance + blinded audit</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 394.927181)">Cluster-aware confidence intervals</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="403.2" y="336.125925" transform="rotate(-0 403.2 336.125925)">Prequential evolution</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 366.624759)">Execute -&gt; score -&gt; receive feedback</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 380.77597)">Then update for subsequent tasks</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 394.927181)">Compare with the same frozen initial bank</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="748.62" y="336.125925" transform="rotate(-0 748.62 336.125925)">Real-world pilot</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 366.624759)">Randomize teams / library namespaces</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 380.77597)">Log all eligible tasks and spillover</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 394.927181)">Task quality, labor, total lifecycle cost</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e91" x="47.52" y="499.2624" transform="rotate(-0 47.52 499.2624)">Primary outcomes: task success | net human time | total cost per successful task</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526372" x="47.52" y="537.9318" transform="rotate(-0 47.52 537.9318)">Guardrails: useful-method retention | version regressions | latency | permission violations | deferred work</text>
   </g>
  </g>
 </g>
