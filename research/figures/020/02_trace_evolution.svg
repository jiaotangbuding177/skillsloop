   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="40.68" y="45.7758" transform="rotate(-0 40.68 45.7758)">A correction revises evidence, not just the final answer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526372" x="40.68" y="77.4144" transform="rotate(-0 40.68 77.4144)">Illustrative task sequence | Outcomes remain UNKNOWN unless supported. Values here are states, not measurements.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="57.78" y="156.840525" transform="rotate(-0 57.78 156.840525)">t1  Initial task</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 187.339359)">Produce a sales report</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 201.49057)">Initial period/refund rule</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="310.86" y="156.840525" transform="rotate(-0 310.86 156.840525)">t2  Task correction</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(310.86 187.339359)">Separate cross-period refunds</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(310.86 201.49057)">Keep original attempt</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="563.94" y="156.840525" transform="rotate(-0 563.94 156.840525)">t3  Stable window</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(563.94 187.339359)">Seal revisable trace</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(563.94 201.49057)">UNKNOWN is admissible</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="817.02" y="156.840525" transform="rotate(-0 817.02 156.840525)">t4  Skill proposal</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(817.02 187.339359)">NEW or attributed UPDATE</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(817.02 201.49057)">Freeze revision + version</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="57.78" y="350.187525" transform="rotate(-0 57.78 350.187525)">Evidence retained</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 380.686359)">Goal + attempts + corrections</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 394.83757)">Technical state separate from outcome</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(57.78 408.988781)">Revision history remains inspectable</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="403.2" y="350.187525" transform="rotate(-0 403.2 350.187525)">Late feedback</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 380.686359)">Reopen task and supersede evidence</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 394.83757)">Invalidate unpublished stale candidates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(403.2 408.988781)">Do not erase published history</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #155e63" x="748.62" y="350.187525" transform="rotate(-0 748.62 350.187525)">Reuse-aware decision</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 380.686359)">No delta -&gt; SUPPORT</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 394.83757)">One used skill + delta -&gt; UPDATE</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #263943" transform="translate(748.62 408.988781)">Unclear attribution -&gt; DEFER</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526372" x="473.31" y="272.5191" transform="rotate(-0 473.31 272.5191)">re-open</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526372" x="47.52" y="520.3548" transform="rotate(-0 47.52 520.3548)">Not a universal semantic segmenter: implicit continuation and interleaved tasks remain research gaps.</text>
   </g>
  </g>
 </g>
