<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>星岚下载页</title><style>body{margin:0;font:16px/1.65 system-ui;color:#243447;background:#fafcfd}header,main,footer{max-width:1040px;margin:auto;padding:28px}header{background:#284b63;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{border:1px solid #ccd8df;padding:20px;border-radius:12px}a{color:inherit}button{padding:12px 20px}@media(max-width:760px){.cards{grid-template-columns:1fr}}</style></head><body><header><h1>星岚文档</h1></header><main><h2>项目报告</h2><button id="download">保存项目报告</button><p id="state" role="status"></p><p>保存后可在浏览器下载列表查看。</p></main><script>document.querySelector("#download").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["项目报告\n本次交付：风险与行动"],{type:"text/plain;charset=utf-8"}));a.download="项目报告.txt";a.click();document.querySelector("#state").textContent="已发起保存，请查看浏览器下载列表";};</script></body></html>
